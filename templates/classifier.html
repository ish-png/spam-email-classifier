<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classifier - Spam Email Classifier</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

  <!-- Navigation -->
  <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom sticky-top">
    <div class="container">
      <a class="navbar-brand text-primary d-flex align-items-center gap-2" href="{{ url_for('dashboard_page') }}">
        <i class="bi bi-shield-check fs-4"></i>
        <span>SpamGuard ML</span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navContent">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navContent">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link" href="{{ url_for('dashboard_page') }}"><i class="bi bi-speedometer2 me-1"></i> Dashboard</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" href="{{ url_for('classifier_page') }}"><i class="bi bi-envelope-check me-1"></i> Classifier</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{{ url_for('history_page') }}"><i class="bi bi-clock-history me-1"></i> History</a>
          </li>
        </ul>
        <div class="d-flex align-items-center gap-3">
          <span class="text-muted small"><i class="bi bi-person-circle me-1"></i> admin</span>
          <a href="{{ url_for('logout') }}" class="btn btn-outline-danger btn-sm">
            <i class="bi bi-box-arrow-right me-1"></i> Logout
          </a>
        </div>
      </div>
    </div>
  </nav>

  <div class="container py-4" style="max-width: 900px;">
    <div class="mb-4">
      <h2 class="fw-bold mb-1">Spam Email & Message Classifier</h2>
      <p class="text-muted small">Enter or paste an email message below for real-time NLP preprocessing and Machine Learning inference.</p>
    </div>

    <div class="alert alert-danger d-none" id="errorAlert" role="alert"></div>

    <!-- Classifier Form -->
    <div class="card p-4 shadow-sm">
      <form id="classifyForm">
        <div class="mb-3">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <label for="emailText" class="form-label fw-semibold mb-0">Email / Message Content</label>
            <span class="text-muted small">Max 50,000 characters</span>
          </div>
          <textarea
            class="form-control"
            id="emailText"
            name="text"
            rows="6"
            placeholder="Paste your email or message here..."
            required
          ></textarea>
        </div>

        <!-- Sample Presets for Testing -->
        <div class="mb-4">
          <span class="small text-muted fw-semibold me-2">Sample Presets:</span>
          <button type="button" class="btn btn-sm btn-outline-secondary mb-1" onclick="loadPreset('Congratulations! You have won a $1,000 Walmart Gift Card. Click http://bit.ly/claim-prize now before it expires!')">
            🎁 Lottery Spam
          </button>
          <button type="button" class="btn btn-sm btn-outline-secondary mb-1" onclick="loadPreset('URGENT: Your bank account has been suspended due to suspicious activity. Verify identity immediately at http://secure-bank-login.com')">
            ⚠️ Phishing Bank Alert
          </button>
          <button type="button" class="btn btn-sm btn-outline-secondary mb-1" onclick="loadPreset('Hi team, please find attached the meeting minutes from today\'s sprint planning. Let me know if anything was missed.')">
            💼 Work Meeting (Ham)
          </button>
          <button type="button" class="btn btn-sm btn-outline-secondary mb-1" onclick="loadPreset('Are we still on for lunch tomorrow around 12:30 PM at the usual cafe? Let me know if that works.')">
            ☕ Casual Chat (Ham)
          </button>
        </div>

        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-primary px-4 py-2 fw-semibold" id="submitBtn">
            <span class="spinner-border spinner-border-sm me-2 d-none" id="btnSpinner" role="status"></span>
            <i class="bi bi-search me-1"></i> Analyze Message
          </button>
          <button type="button" class="btn btn-outline-secondary px-3 py-2" onclick="clearInput()">
            <i class="bi bi-x-circle me-1"></i> Clear
          </button>
        </div>
      </form>
    </div>

    <!-- Prediction Result Area -->
    <div id="resultArea"></div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
</body>
</html>
